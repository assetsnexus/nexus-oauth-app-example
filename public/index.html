<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login with Nexus</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 42rem; }
    button, input { font: inherit; }
    section { margin: 1.5rem 0; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Login with Nexus</h1>
  <section>
    <button id="login-user" type="button">Log in</button>
    <label>Org id <input id="org-id" placeholder="org id" /></label>
    <button id="login-org" type="button">Log in as org member</button>
  </section>
  <section>
    <button id="refresh" type="button">Refresh identities, status, and fields</button>
    <button id="subscription" type="button">App subscription</button>
    <button id="request-phone" type="button">Request phone field</button>
    <button id="request-batch" type="button">Request a command batch</button>
  </section>
  <pre id="out">Not loaded.</pre>
  <script src="/app.js"></script>
</body>
</html>
